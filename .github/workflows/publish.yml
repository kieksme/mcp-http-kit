name: Publish

# Publishes @kieksme/mcp-http-kit to npmjs.com and GitHub Packages for an existing release tag.
# Started by release-please.yml after a release; can also be run manually to re-publish a tag.
#
# npm Trusted Publishing: npmjs.com > @kieksme/mcp-http-kit > Settings > Trusted Publisher must list
# repository kieksme/mcp-http-kit with the workflow file name `publish.yml` (no environment).
# The file name must not change. Trusted Publishing needs a GitHub-hosted runner, Node >= 22.14 and npm >= 11.5.1.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tag matches package.json version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG does not match package.json version $VERSION"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:check

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npmjs.com (Trusted Publishing, provenance)
        run: npx --yes npm@11.5.1 publish --access public --provenance

  publish-github:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@kieksme'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'
        run: npx --yes npm@11.5.1 publish --access public --provenance=false
